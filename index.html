<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="<%= cspMeta %>" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="themeColor" content="#0B7F6B" />
    <meta name="application-name" content="Edovita" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Edovita" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Edovita</title>
    <link rel="manifest" href="<%= publicBase %>manifest.webmanifest" />
    <link rel="icon" href="<%= publicBase %>favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="<%= publicBase %>assets/edovita_appicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= publicBase %>icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= publicBase %>icons/favicon-16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= publicBase %>icons/apple-touch-icon-180.png"
    />
    <script src="<%= publicBase %>theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
