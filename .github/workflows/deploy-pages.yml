# Statische Vorschau auf GitHub Pages (kostenlos, öffentliches Repo).
# Deploy nur nach grüner CI auf main des eigenen Repos (workflow_run nach
# push, nicht nach Fork- oder PR-Läufen), oder per workflow_dispatch auf main
# nachdem die CI für genau diesen Commit grün ist.
name: Deploy Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Schreibrechte nur im Deploy-Job (Least Privilege).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # H1: branches: [main] prüft nur den Branch-Namen. Zusätzlich Event, Branch
    # und eigenes Repo verlangen, sonst könnte ein Fork-PR namens main deployen.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify CI is green for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${COMMIT_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Ungültiger Commit-SHA, Abbruch." >&2
            exit 1
          fi
          if ! printf '%s' "${GITHUB_REPOSITORY}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "Ungültiges GITHUB_REPOSITORY, Abbruch." >&2
            exit 1
          fi
          HEAD="$(git rev-parse HEAD)"
          if [ "${HEAD}" != "${COMMIT_SHA}" ]; then
            echo "Checkout (${HEAD}) weicht von github.sha (${COMMIT_SHA}) ab." >&2
            exit 1
          fi
          COUNT="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT_SHA}&event=push&status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha == env.COMMIT_SHA and .event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success" and .head_repository.full_name == env.GITHUB_REPOSITORY)] | length'
          )"
          if [ "${COUNT}" = "0" ]; then
            echo "Kein grüner CI-Lauf (Workflow «CI», push auf main) für ${COMMIT_SHA}. Deploy abgebrochen." >&2
            exit 1
          fi
          echo "CI für ${COMMIT_SHA} ist grün (${COUNT} erfolgreicher Lauf/Läufe)."

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: pnpm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Check Pages prefix and CSP meta
        env:
          GITHUB_PAGES: "true"
        run: pnpm run security:check

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
